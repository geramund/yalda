    <!-- Mailing list. The site is static, so the form posts to FormSubmit,
         which relays each signup to farnoosh.fathi@gmail.com and sends the
         visitor on to thanks.html. The hidden _ fields are FormSubmit's
         settings, not data. -->
    <form class="maillist" action="https://formsubmit.co/farnoosh.fathi@gmail.com" method="POST">
      <strong>YALDA MAILING LIST</strong>
      <label for="ml-email">Email address:</label>
      <input id="ml-email" name="email" type="email" required autocomplete="email">

      <input type="hidden" name="_subject" value="new yalda mailing list signup">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="https://yaldacollective.org/thanks.html">
      <!-- Bait field: real people never see it, bots fill it and get dropped. -->
      <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off">

      <button type="submit">JOIN</button>
    </form>

    <!-- Click through to the full-size flier. -->
    <a class="flier" href="yaldaflier.png">
      <img src="yaldaflier.png" alt="YALDA Chapbook Launch, 22 August 2026, 5 PM, Ugly Duckling Presse Studio, American Can Factory, Brooklyn">
    </a>

    <a class="photo" href="lecriture.png">
      <img src="lecriture.png" alt="Young writers reading together at a picnic table">
